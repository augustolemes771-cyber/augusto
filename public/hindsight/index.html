<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<link rel="manifest" href="manifest.json">
<title>Hindsight Cam</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
  video{flex:1;width:100%;object-fit:cover;background:#111;min-height:0}
  .bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  select,button{font:inherit;border-radius:10px;border:0;padding:10px 12px}
  select{background:#222;color:#fff}
  #start{background:#2b6;color:#fff;flex:1}
  #save{width:84px;height:84px;border-radius:50%;background:#e33;color:#fff;font-weight:700;border:4px solid #fff;margin:auto}
  #save:disabled{opacity:.4}
  #status{font-size:14px;color:#aaa;text-align:center}
  .rec{color:#e33}
  #clips{display:flex;gap:8px;overflow-x:auto}
  #clips a{color:#9cf;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<div class="bar">
  <div class="row">
    <label>Antes <select id="before"><option>15</option><option selected>30</option><option>60</option></select>s</label>
    <label>Depois <select id="after"><option>0</option><option selected>5</option><option>15</option><option>30</option></select>s</label>
    <select id="cam"><option value="environment">Traseira</option><option value="user">Frontal</option></select>
  </div>
  <div class="row"><button id="start">▶ Ligar Hindsight</button></div>
  <button id="save" disabled>SALVAR</button>
  <div id="status">Desligado</div>
  <div id="clips"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let stream, timer, recs = [], T = 30, mime = '', busy = false;

function pickMime(){
  for (const m of ['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm'])
    if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}

// Novo gravador a cada T segundos; cada um vive até 2T.
// Ao salvar, o mais antigo sempre tem entre T e 2T de vídeo passado.
function spawn(){
  const r = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: 5e6} : {});
  r.chunks = []; r.t0 = Date.now(); r.keep = false;
  r.ondataavailable = e => e.data.size && r.chunks.push(e.data);
  r.onstop = () => { if (r.keep) finish(r); };
  r.start(1000);
  recs.push(r);
  const now = Date.now();
  recs = recs.filter(x => {
    if (now - x.t0 > 2*T*1000 + 500 && !x.keep) { x.stop(); x.chunks = []; return false; }
    return true;
  });
}

async function start(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:$('cam').value, width:{ideal:1920}, height:{ideal:1080}}, audio:true});
  } catch(e){ $('status').textContent = 'Erro de câmera: ' + e.message; return; }
  $('v').srcObject = stream;
  try { await navigator.wakeLock?.request('screen'); } catch {}
  T = +$('before').value; mime = pickMime();
  spawn(); timer = setInterval(spawn, T*1000);
  $('start').textContent = '■ Desligar'; $('start').style.background = '#555';
  $('save').disabled = false;
  tick();
}

function stopAll(){
  clearInterval(timer); recs.forEach(r => r.state !== 'inactive' && !r.keep && r.stop()); recs = [];
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $('start').textContent = '▶ Ligar Hindsight'; $('start').style.background = '#2b6';
  $('save').disabled = true; $('status').textContent = 'Desligado';
}

function tick(){
  if (!stream) return;
  const r = recs.filter(x => !x.keep)[0];
  const buf = r ? Math.min((Date.now() - r.t0)/1000, 2*T) : 0;
  if (!busy) $('status').innerHTML = `<span class="rec">●</span> Buffer: ${buf.toFixed(0)}s (salva ~${T}–${2*T}s antes)`;
  setTimeout(tick, 500);
}

function save(){
  const r = recs.filter(x => !x.keep)[0];
  if (!r) return;
  r.keep = true; recs = recs.filter(x => x !== r);
  const after = +$('after').value;
  busy = true; $('status').textContent = after ? `Gravando mais ${after}s…` : 'Salvando…';
  setTimeout(() => r.stop(), after*1000);
}

function finish(r){
  const ext = (r.mimeType || mime).includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(r.chunks, {type: r.mimeType || mime});
  const url = URL.createObjectURL(blob);
  const name = `hindsight-${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`;
  const a = document.createElement('a'); a.href = url; a.download = name; a.textContent = '⬇ ' + name.slice(10,29);
  $('clips').prepend(a); a.click();
  busy = false; $('status').textContent = `Salvo! (${(blob.size/1e6).toFixed(1)} MB)`;
}

$('start').onclick = () => stream ? stopAll() : start();
$('save').onclick = save;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
